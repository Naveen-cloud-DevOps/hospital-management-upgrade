apiVersion: apps/v1
kind: Deployment
metadata: {name: billing-service, namespace: hms}
spec:
  replicas: 2
  selector: {matchLabels: {app: billing-service}}
  template:
    metadata: {labels: {app: billing-service}}
    spec:
      serviceAccountName: hms-sa
      containers:
        - name: app
          image: 497046674646.dkr.ecr.us-east-1.amazonaws.com/hospital-management-billing:1829ea0c9030e7cc8d15d7babdc4818c2dfa416a
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: hms-config}
            - secretRef: {name: hms-secrets}
            - secretRef: {name: billingdb-conn}   # RDS endpoints + credentials, created by the deploy job
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: billing-service, namespace: hms}
spec:
  selector: {app: billing-service}
  ports: [{port: 80, targetPort: 8000}]
