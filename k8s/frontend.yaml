apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: hms}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: 637423280402.dkr.ecr.us-east-1.amazonaws.com/hospital-management-frontend:86c428fc6adfb3cffb4e11a4e1fa7f6c9a01c9e3
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: hms}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080}]
