apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: hms}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: 383975042508.dkr.ecr.us-east-1.amazonaws.com/hospital-management-frontend:162bf23f507c6367e3b58d1e34ce93bef5a456f5
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: hms}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080}]
