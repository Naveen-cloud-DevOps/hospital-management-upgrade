# Values for grafana/loki-stack (release name: loki, namespace: monitoring)
# Loki stores the logs, Promtail runs on every node and ships every pod's logs. Grafana/Prometheus come from the other chart.
loki:
  enabled: true
  persistence: {enabled: false}      # no EBS CSI driver in this cluster, so logs are kept in the pod only
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
promtail:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
grafana: {enabled: false}
prometheus: {enabled: false}
filebeat: {enabled: false}
fluent-bit: {enabled: false}
logstash: {enabled: false}