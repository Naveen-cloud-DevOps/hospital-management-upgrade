# Values for prometheus-community/kube-prometheus-stack (release name: kube-prometheus-stack, namespace: monitoring)
# No passwords here: Grafana login comes from secret "grafana-admin", SMTP password from secret "alertmanager-smtp"
# (both created by .github/workflows/monitoring.yml from GitHub secrets).
#
# NOTE: Terraform in this repo does not install the EBS CSI driver, so nothing here uses PersistentVolumes.
# Data lives in the pod (emptyDir) and is lost when a pod restarts. Add EBS CSI + storage later if you need history.

# EKS hides the control plane, so these cannot be scraped (they would only create false alerts)
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

# ---------------- Grafana ----------------
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: LoadBalancer
    port: 80
  persistence: {enabled: false}
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard}
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

# ---------------- Prometheus ----------------
prometheus:
  service:
    type: LoadBalancer
    port: 9090
  prometheusSpec:
    retention: 7d
    # pick up every ServiceMonitor / PodMonitor / rule, not only ones labelled with the Helm release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2Gi}

# ---------------- CPU alert rules ----------------
additionalPrometheusRulesMap:
  hms-cpu-alerts:
    groups:
      - name: hms-cpu
        rules:
          - alert: NodeHighCPU
            expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80
            for: 5m
            labels: {severity: warning, notify: email}
            annotations:
              summary: "High CPU on node {{ $labels.instance }}"
              description: "Node {{ $labels.instance }} CPU has been above 80% for 5 minutes (now {{ $value | printf \"%.1f\" }}%)."
          - alert: PodHighCPU
            # cores used by the whole pod; 0.8 = 80% of one core. Change the number to tune it.
            expr: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="", pod!=""}[5m])) > 0.8
            for: 5m
            labels: {severity: warning, notify: email}
            annotations:
              summary: "High CPU in pod {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has used more than 0.8 CPU cores for 5 minutes (now {{ $value | printf \"%.2f\" }} cores)."

# ---------------- Alertmanager: email through Gmail SMTP ----------------
alertmanager:
  alertmanagerSpec:
    secrets: [alertmanager-smtp]      # mounted at /etc/alertmanager/secrets/alertmanager-smtp/
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: ritikranjanspiderhacker@gmail.com
      smtp_auth_username: ritikranjanspiderhacker@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: email               # only rules labelled notify=email are mailed
          matchers: ['notify="email"']
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: ritikranjanspiderhacker@gmail.com
            send_resolved: true