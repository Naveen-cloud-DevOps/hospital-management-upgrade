<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2563eb">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarePulse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%23312e81'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg transform='translate(5 5) scale(.91)' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/%3E%3Cpath d='M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Oriya:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CarePulse - modern UI  (CSS only: all markup hooks / JS logic unchanged)
   ========================================================================== */
:root{
  --ink:#0b1220;--muted:#55607a;--line:#e6e9f2;--bg:#f5f6fb;--soft:#eef1f8;--surface:#ffffff;--surface-2:#fafbfe;
  --acc:#2563eb;--acc-d:#1d4ed8;--acc2:#0d9488;--acc-l:color-mix(in srgb,var(--acc) 13%,var(--surface));--link:color-mix(in srgb,var(--acc) 76%,#000);
  --brand:var(--acc);--brand-d:color-mix(in srgb,var(--acc) 70%,#000);--brand-l:var(--acc-l);
  --amber:#b45309;--amber-l:#fef3c7;--green:#047857;--green-l:#d1fae5;--red:#dc2626;--red-l:#fee2e2;
  --r:18px;--r-sm:12px;
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.04);
  --sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px -8px rgba(16,24,40,.08);
  --sh-lg:0 24px 60px -16px rgba(16,24,40,.28);
  --glass:rgba(255,255,255,.78);
  --ring:color-mix(in srgb,var(--acc) 28%,transparent);
  --side-w:272px;--top-h:68px;
}
[data-theme=dark]{
  color-scheme:dark;
  --ink:#f1f4fb;--muted:#9aa4bf;--line:#232c45;--bg:#0a0f1d;--soft:#161d33;--surface:#10172a;--surface-2:#131b30;
  --acc-l:color-mix(in srgb,var(--acc) 24%,var(--surface));--brand-d:color-mix(in srgb,var(--acc) 35%,#fff);--link:color-mix(in srgb,var(--acc) 45%,#fff);
  --amber:#fbbf24;--amber-l:#3a2a0a;--green:#34d399;--green-l:#0d2f25;--red:#f87171;--red-l:#3a1414;
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.6);--sh-lg:0 24px 60px -16px rgba(0,0,0,.8);
  --glass:rgba(16,23,42,.78);
}
[data-accent=teal]{--acc:#0f766e;--acc-d:#115e59;--acc2:#2563eb}
[data-accent=violet]{--acc:#7c3aed;--acc-d:#6d28d9;--acc2:#2563eb}
[data-accent=rose]{--acc:#e11d48;--acc-d:#be123c;--acc2:#f59e0b}
[data-accent=orange]{--acc:#c2410c;--acc-d:#9a3412;--acc2:#0d9488}

*{box-sizing:border-box}
html,body{min-height:100%}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 "Inter","Noto Sans Devanagari","Noto Sans Oriya","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 60%),radial-gradient(700px 400px at -5% 105%,color-mix(in srgb,var(--acc2) 9%,transparent),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.02em}
a{color:inherit}
::selection{background:color-mix(in srgb,var(--acc) 25%,transparent)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.grow{flex:1}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;border:2px solid transparent}

/* ---------- buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;color:#fff;font-weight:600;font-size:14.5px;padding:10px 18px;border-radius:12px;cursor:pointer;white-space:nowrap;
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 88%,#fff),var(--acc));
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -6px color-mix(in srgb,var(--acc) 70%,transparent);
  transition:transform .15s,box-shadow .15s,background .15s,filter .15s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 22px -8px color-mix(in srgb,var(--acc) 80%,transparent)}
.btn:active{transform:none;filter:brightness(.97)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh-1)}
.btn.ghost:hover{background:var(--soft);border-color:color-mix(in srgb,var(--acc) 30%,var(--line));filter:none;box-shadow:var(--sh-1)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px;gap:6px}
.btn.block{width:100%;padding:13px 18px;font-size:15.5px;border-radius:14px}
.icon{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);transition:background .15s,color .15s,border-color .15s;text-decoration:none;flex:none}
.icon:hover{background:var(--soft);color:var(--ink)}

/* ---------- fields ---------- */
.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.fld>span small{font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea,.lang{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:400;font-size:14.5px;transition:border-color .15s,box-shadow .15s,background .15s;box-shadow:var(--sh-1)}
.fld input:hover,.fld select:hover,.fld textarea:hover,.lang:hover{border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.fld input:focus,.fld select:focus,.fld textarea:focus,.lang:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--ring)}
.fld input[type=file]{padding:9px 12px;cursor:pointer}
.fld input[type=file]::file-selector-button{border:0;background:var(--acc-l);color:var(--brand-d);font-weight:600;padding:6px 12px;border-radius:8px;margin-right:12px;cursor:pointer}
.fld textarea{resize:vertical;min-height:96px}
.lang{width:auto;padding:8px 12px;font-size:13.5px;font-weight:500;cursor:pointer;border-radius:12px}
::placeholder{color:#98a2b3;opacity:1}[data-theme=dark] ::placeholder{color:#6b7592}
select,option,optgroup{background-color:var(--surface);color:var(--ink)}
[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] select{color:var(--ink)}
.pw{position:relative}.pw input{padding-right:46px}.pw .eye{position:absolute;right:4px;top:3px}
.meter{display:flex;gap:4px;margin-top:2px}.meter i{flex:1;height:4px;border-radius:2px;background:var(--soft)}
.meter.s1 i:nth-child(1){background:#ef4444}.meter.s2 i:nth-child(-n+2){background:#f59e0b}.meter.s3 i{background:#10b981}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.ferr{min-height:20px;color:var(--red);font-size:13.5px;font-weight:500}
.chk{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer;font-weight:500}.chk input{accent-color:var(--acc);width:16px;height:16px}
.rowline{display:flex;justify-content:space-between;align-items:center;font-size:14px}.rowline a{color:var(--acc);font-weight:600;text-decoration:none}.rowline a:hover{text-decoration:underline}

/* ---------- brand ---------- */
.brandrow{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:-.02em;position:relative}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px -6px color-mix(in srgb,var(--acc) 70%,transparent),0 1px 0 rgba(255,255,255,.3) inset}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:minmax(380px,1.05fr) minmax(400px,1fr);min-height:100vh}
.auth-side{position:relative;overflow:hidden;color:#fff;padding:48px 60px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(700px 500px at 100% 0,color-mix(in srgb,var(--acc2) 55%,transparent),transparent 60%),radial-gradient(600px 500px at 0 100%,color-mix(in srgb,var(--acc) 60%,transparent),transparent 60%),linear-gradient(160deg,#070d24,#0f1b4d 60%,#132a6b)}
.auth-side::before,.auth-side::after{content:"";position:absolute;border-radius:50%;pointer-events:none;border:1px solid rgba(255,255,255,.08)}
.auth-side::before{width:520px;height:520px;right:-180px;bottom:-160px;box-shadow:0 0 0 70px rgba(255,255,255,.025),0 0 0 140px rgba(255,255,255,.02)}
.auth-side::after{width:240px;height:240px;left:-90px;top:30%}
.auth-side .brandrow,.auth-side h1,.auth-side p,.feats li{color:#fff}
.auth-side h1{font-size:clamp(32px,3.4vw,46px);line-height:1.08;font-weight:800;max-width:13em;margin-bottom:16px;letter-spacing:-.035em}
.auth-side p{color:rgba(255,255,255,.78);max-width:30em;font-size:16px}
.auth-side .ecg{position:absolute;left:-20px;right:-20px;top:30%;width:calc(100% + 40px);height:200px;opacity:.55}
.ecg polyline{fill:none;stroke:color-mix(in srgb,var(--acc2) 70%,#fff);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--acc2) 80%,transparent));stroke-dasharray:1400;stroke-dashoffset:1400;animation:ecg 3.2s ease-out .2s forwards}
@keyframes ecg{to{stroke-dashoffset:0}}
.feats{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:12px;position:relative}
.feats li{display:flex;gap:14px;align-items:center;font-weight:500;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);max-width:30em}
.feats li span{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.auth-main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;position:relative}
.auth-top{position:absolute;top:20px;right:22px;display:flex;gap:8px;align-items:center}
.auth-card{width:100%;max-width:420px;padding:36px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-lg);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.auth-card .mob{display:none;margin-bottom:22px}
.auth-card h2{font-size:28px;font-weight:800;margin-bottom:6px;letter-spacing:-.03em}
.auth-card .sub{color:var(--muted);margin-bottom:26px}
.auth-card form{display:grid;gap:16px}
.auth-card .alt{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.auth-card .alt button{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:26px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.note{margin-top:20px;padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- app shell ---------- */
.shell{display:block;min-height:100vh}
.hot{display:none}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:40;display:flex;flex-direction:column;gap:6px;padding:20px 16px;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line)}
.side .brandrow{padding:4px 10px 18px}
.nav{display:grid;gap:2px}
.nav-sec{margin:18px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.85}
.nav-sec:first-child{margin-top:4px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px;transition:background .15s,color .15s}
.nav a svg{flex:none;transition:transform .2s}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a:hover svg{transform:scale(1.08)}
.nav a.on{background:var(--acc-l);color:var(--brand-d);font-weight:600}

.nav a.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--acc),var(--acc2))}
.nav a.on svg{color:var(--acc)}
[data-theme=dark] .nav a.on svg{color:color-mix(in srgb,var(--acc) 60%,#fff)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:flex;gap:11px;align-items:center;min-width:0;transition:border-color .15s}
.side-foot:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.side-foot div{min-width:0;line-height:1.3}
.side-foot b,.side-foot small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot b{font-size:14px}.side-foot small{color:var(--muted);font-size:12.5px}
.side-out{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;color:var(--red);font-weight:600;background:none;border:0;cursor:pointer;font-size:14.5px}
.side-out:hover{background:var(--red-l)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc-l),color-mix(in srgb,var(--acc2) 22%,var(--acc-l)));color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;border:1px solid color-mix(in srgb,var(--acc) 15%,transparent)}


.main{margin-left:var(--side-w);min-width:0}
.top{display:flex;align-items:center;gap:10px;height:var(--top-h);padding:0 32px;position:sticky;top:0;z-index:30;
  background:var(--glass);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.top-brand{display:none;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:800;font-size:18px}
.top h2{font-size:18px;font-weight:700}
.dt{color:var(--muted);font-size:13.5px;font-weight:500;padding:7px 14px;background:var(--soft);border-radius:99px;white-space:nowrap}
.swatches{display:flex;gap:6px;margin:0 6px;padding:5px 8px;background:var(--soft);border-radius:99px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);background:var(--s);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:transform .15s}
.sw:hover{transform:scale(1.18)}.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.content{padding:30px 32px 56px;max-width:1500px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.page-h h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.page-h p{color:var(--muted);margin-top:4px}
.mailbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 32px;background:var(--amber-l);border-bottom:1px solid color-mix(in srgb,var(--amber) 25%,transparent);color:var(--amber);font-size:14px;font-weight:500}
.mailbar p{flex:1;min-width:220px}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow:hidden;box-shadow:var(--sh)}
.panel-h{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:16px;font-weight:700}
.panel-b{padding:22px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start;margin-bottom:22px}
.cols.even{grid-template-columns:1fr 1fr}
.cols .panel{margin-bottom:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:18px 22px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1}.stat span{color:var(--muted);font-size:13.5px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:40px 44px;margin-bottom:24px;color:#fff;
  background:radial-gradient(600px 300px at 100% 0,color-mix(in srgb,var(--acc2) 70%,transparent),transparent 65%),radial-gradient(500px 300px at 0 100%,color-mix(in srgb,var(--acc) 70%,transparent),transparent 65%),linear-gradient(135deg,#0a1130,#14246b 70%,#0d2f5e);
  box-shadow:var(--sh-lg)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.1);pointer-events:none}
.hero::before{width:360px;height:360px;right:-90px;top:-130px;box-shadow:0 0 0 50px rgba(255,255,255,.03),0 0 0 100px rgba(255,255,255,.02)}
.hero::after{width:150px;height:150px;right:230px;bottom:-80px}
.hero>*{position:relative}
.hero small{display:inline-block;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);letter-spacing:.08em;font-weight:600;color:#fff;text-transform:uppercase;font-size:11.5px;backdrop-filter:blur(6px)}
.hero h2{font-size:clamp(26px,3.4vw,40px);margin:16px 0 10px;color:#fff;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.hero p{color:rgba(255,255,255,.8);max-width:560px;font-size:16px}
.hero .btn{background:#fff;color:#0b1437;border-color:#fff;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.hero .btn:hover{filter:none;background:#f1f5ff}
.hero .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none;backdrop-filter:blur(6px)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.22)}

/* ---------- KPIs + charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.kpi::before{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.kpi i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);position:relative}
.kpi div{position:relative;min-width:0}
.kpi b{display:block;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.kpi span{display:block;color:var(--muted);font-size:13px;font-weight:500;line-height:1.3;margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:12px;height:200px;padding:18px 22px 16px;background:repeating-linear-gradient(to top,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px) bottom/100% 100% no-repeat}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.bars div small{font-size:11.5px;color:var(--ink);font-weight:600}
.bars i{display:block;width:100%;max-width:40px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--acc2),var(--acc));min-height:4px;transition:transform .2s,filter .2s;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1)}
.bars div:hover i{filter:brightness(1.15);transform:scaleX(1.08)}
@keyframes grow{from{transform:scaleY(0)}}
.dt+.swatches{margin-left:0}

/* ---------- tables ---------- */
.scroll{overflow:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--acc) 4%,transparent)}
.tbl tr.click{cursor:pointer}
.tbl small{color:var(--muted)}
.who{display:flex;align-items:center;gap:12px;min-width:0}.who b{display:block;line-height:1.25}.who small{color:var(--muted)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.waiting{background:var(--amber-l);color:var(--amber)}
.pill.in-progress{background:var(--acc-l);color:var(--brand-d)}

.pill.done{background:var(--green-l);color:var(--green)}
.pill.dx{background:var(--soft);color:var(--muted);margin:1px 4px 1px 0;border:1px solid var(--line)}
.pill.role{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.pill.admin{background:color-mix(in srgb,#8b5cf6 16%,transparent);color:#7c3aed;border-color:transparent}
[data-theme=dark] .pill.admin{color:#c4b5fd}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.search{position:relative;flex:1;min-width:200px;max-width:400px}
.search input{width:100%;padding:11px 14px 11px 42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--ring)}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- queue ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.col{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.col h3{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;padding:4px 6px 14px}
.col h3 em{font-style:normal;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--ink);letter-spacing:0}
.ticket{background:var(--surface);border-radius:14px;display:grid;grid-template-columns:72px 1fr;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--sh-1);transition:transform .15s,box-shadow .15s}
.ticket:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.ticket .no{display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--acc);border-right:2px dashed var(--line);position:relative;letter-spacing:-.03em}
.ticket .no::before,.ticket .no::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.ticket .no::before{top:-9px;clip-path:inset(50% 0 0 0)}.ticket .no::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.ticket .info{padding:12px 14px;display:grid;gap:10px;min-width:0}
.ticket .info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .btns{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:grid}
.mini .row{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);transition:background .15s}
.mini .row:last-child{border-bottom:0}
.mini a.row:hover,.mini .row:hover{background:color-mix(in srgb,var(--acc) 4%,transparent)}
.mini .n{font-weight:800;color:var(--acc);width:38px}

/* ---------- patient detail ---------- */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 22px}
.kv div small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
.kv div span{font-weight:500;word-break:break-word}
.kv .full{grid-column:1/-1}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.wk{border:1.5px dashed var(--line);border-radius:14px;padding:12px;text-align:left;background:var(--surface);cursor:pointer;display:grid;gap:2px;transition:border-color .15s,transform .15s}
.wk:hover{border-color:var(--acc);transform:translateY(-2px)}
.wk b{font-size:13.5px}.wk small{color:var(--muted);font-size:12px}
.wk.done{border-style:solid;border-color:color-mix(in srgb,var(--green) 30%,transparent);background:var(--green-l)}.wk.done small{color:var(--green)}
.wk.sel{border-color:var(--acc);box-shadow:0 0 0 4px var(--ring);border-style:solid}
.wkview{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface-2)}
.wkview form{display:grid;gap:14px}
.photo-link{display:inline-flex;gap:6px;align-items:center;color:var(--acc);font-weight:600;text-decoration:none}.photo-link:hover{text-decoration:underline}

/* ---------- forms / chips / slots ---------- */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fg .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipc{position:relative}.chipc input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chipc span{display:inline-block;padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;transition:all .15s}
.chipc:hover span{border-color:var(--acc)}
.chipc input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--acc) 80%,transparent)}
.chipc input:focus-visible+span{outline:3px solid var(--ring);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;gap:6px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font:inherit;font-weight:500;font-size:13.5px;cursor:pointer;transition:all .15s;color:var(--ink)}
.slot:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.slot.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 6px 14px -6px color-mix(in srgb,var(--acc) 80%,transparent)}
.slot:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}

/* ---------- doctors ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.dcard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s}
.dcard::before{content:"";position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,transparent),color-mix(in srgb,var(--acc2) 12%,transparent))}
.dcard:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.dcard>*{position:relative}
.dcard .av{width:62px;height:62px;font-size:19px;margin-bottom:14px;border:3px solid var(--surface);box-shadow:var(--sh)}
.dcard h3{font-size:17px;font-weight:700}
.fee{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;background:var(--acc-l);color:var(--brand-d);font-weight:700;font-size:13px}


/* ---------- drawer / toasts ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.5);backdrop-filter:blur(4px);z-index:60;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:61;display:flex;flex-direction:column;box-shadow:var(--sh-lg);border-left:1px solid var(--line);border-radius:24px 0 0 24px;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.drawer>header{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer>header h2{flex:1;font-size:20px;font-weight:800}
.drawer-b{padding:24px;overflow:auto}
.drawer-f{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;right:22px;bottom:22px;z-index:80;display:grid;gap:10px;max-width:calc(100% - 44px)}
.toast{background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:14px;box-shadow:var(--sh-lg);animation:slide .25s;font-weight:500;border-left:4px solid var(--acc2)}
.toast.err{background:var(--red);color:#fff;border-left-color:#fff}
.toast a{color:inherit;font-weight:700;text-decoration:underline}
.loading{padding:70px;text-align:center;color:var(--muted)}
.ticks{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px}
.ticks li::before{content:"\2713";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--green-l);color:var(--green);font-weight:800;font-size:12px;margin-right:10px}
.rcpt{border:1.5px dashed var(--line);border-radius:16px;padding:22px;background:var(--surface-2)}
.rcpt-h{display:flex;gap:12px;align-items:center;margin-bottom:20px}.rcpt-h small{display:block;color:var(--muted)}
.rcpt-amt{margin-top:20px;padding-top:16px;border-top:2px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline}
.rcpt-amt b{font-size:30px;letter-spacing:-.03em}
@media print{body *{visibility:hidden}#receiptPrint,#receiptPrint *{visibility:visible}#receiptPrint{position:fixed;left:0;top:0;width:100%;border:0;background:#fff;color:#000}}

/* ---------- responsive ---------- */
@media(max-width:1180px){.dt{display:none}}
@media(max-width:1000px){.cols,.cols.even{grid-template-columns:1fr}.board{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.kpi{padding:14px;gap:10px}.kpi i{width:40px;height:40px}.kpi b{font-size:21px}}
@media(max-width:860px){
  .auth{grid-template-columns:1fr}.auth-side{display:none}.auth-card .mob{display:flex}
  .auth-main{padding:20px;justify-content:flex-start;padding-top:72px}.auth-card{padding:26px;border-radius:20px}
  .main{margin-left:0}
  .side{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:auto;flex-direction:row;padding:6px;gap:0;border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh-lg);overflow:visible}
  .side .brandrow,.side-foot,.nav-sec,.side-out{display:none}
  .nav{display:flex;width:100%;overflow-x:auto;scrollbar-width:none;gap:2px}.nav::-webkit-scrollbar{display:none}
  .nav a{flex:1 0 auto;min-width:64px;flex-direction:column;gap:3px;font-size:10.5px;padding:8px 6px;text-align:center;border-radius:14px}
  .nav a.on::before{display:none}
  .top{padding:0 12px;height:60px;gap:4px}.top-brand{display:flex;font-size:17px;gap:8px}.top-brand .logo{width:34px;height:34px;border-radius:11px}.top .lang{padding:7px 8px;max-width:92px;font-size:13px}.top .icon{width:34px;height:34px}.top .btn.sm{padding:0;width:34px;height:34px;border-radius:10px}.top h2{display:none}.swatches{display:none}.top .btn span{display:none}
  .content{padding:20px 14px 110px}.mailbar{padding:10px 14px}.toasts{bottom:96px;right:14px}
  .hero{padding:28px 24px;border-radius:20px}
  .stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .fg,.kv{grid-template-columns:1fr}
  .weeks{grid-template-columns:repeat(5,minmax(84px,1fr));overflow:auto}
  .drawer{border-radius:0}
  .page-h h1{font-size:24px}
}

/* ---------- premium UI layer (theme-aware text colours) ---------- */
::placeholder{color:#6b7690}[data-theme=dark] ::placeholder{color:#8a95b3}
.btn{background:linear-gradient(180deg,var(--acc),var(--acc-d))}
.rowline a,.auth-card .alt button,.photo-link,.ticket .no,.mini .n,.page-h h1 .gname{color:var(--link)}
.side{background:linear-gradient(180deg,#0c1738,#091026 70%,#070d1e);border-right:1px solid rgba(255,255,255,.07)}
.side .brandrow{color:#fff}.nav a{color:#b9c5e6}.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:linear-gradient(135deg,var(--acc-d),color-mix(in srgb,var(--acc2) 70%,#000));color:#fff;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--acc) 80%,transparent)}
.nav a.on svg{color:#fff}.nav a.on::before{display:none}.nav-sec{color:#8f9cc2;opacity:1}
.side-foot{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#fff}.side-foot small{color:#b4c0e2}
.side-out{color:#fda4af}.side-out:hover{background:rgba(244,63,94,.16)}
.side .av{background:linear-gradient(135deg,var(--acc-d),color-mix(in srgb,var(--acc2) 70%,#000));color:#fff;border-color:transparent}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{flex-direction:column;align-items:flex-start;gap:14px;padding:20px;text-decoration:none;color:inherit;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 15%,var(--surface)),var(--surface) 75%)}
.kpi i{width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;box-shadow:0 8px 18px -6px var(--c)}
.kpi b{font-size:28px}.kpi div{padding-right:34px}
.kpi .go{position:absolute;right:14px;bottom:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink);transition:transform .2s}
.kpi:hover .go{transform:translateX(3px)}
.chart{display:grid;grid-template-columns:auto 1fr;grid-template-rows:240px auto;gap:0 12px;padding:24px 22px 16px}
.yax{display:flex;flex-direction:column;justify-content:space-between;text-align:right;font-size:12px;line-height:18px;margin:-9px 0;color:var(--muted)}
.plot{position:relative;border-bottom:1px solid var(--line)}
.plot hr{position:absolute;left:0;right:0;margin:0;border:0;border-top:1px dashed var(--line)}
.chart .bars{position:absolute;inset:0;height:auto;padding:0;gap:0;background:none}
.chart .bars div{gap:0}.chart .bars i{width:54%;max-width:44px}
.xax{grid-column:2;display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);padding-top:10px}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plot .ln{fill:none;stroke:var(--link);stroke-width:2.5;vector-effect:non-scaling-stroke}
.plot .area{fill:color-mix(in srgb,var(--acc) 16%,transparent)}
.dot{position:absolute;width:10px;height:10px;margin:0 0 -5px -5px;border-radius:50%;background:var(--surface);border:2.5px solid var(--link)}
@media(max-width:860px){.side{background:#0b1430;border-color:rgba(255,255,255,.1)}.chart{grid-template-rows:200px auto;padding:18px 14px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ecg polyline{stroke-dashoffset:0}}
</style>

 grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',

 x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
 cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
 pulse:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
 back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
 mail:'<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/>',
 hourglass:'<path d="M5 22h14M5 2h14"/><path d="M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4A2 2 0 0 0 7 17.8V22"/><path d="M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4A2 2 0 0 0 17 6.2V2"/>',
 arrow:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>'
};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const logo=()=>`<span class="logo" role="img" aria-label="${t('app')}">${ic('heartpulse',21)}</span>`;

async function api(path,o={}){
 const h={...(o.headers||{})};if(S.tok)h.Authorization='Bearer '+S.tok;
 let body=o.body,method=o.method;
 if(o.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.json);method=method||'POST'}
 const r=await fetch(path,{method,body,headers:h});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){
  if(r.status===401&&S.tok&&!o.noLogout)signOut();
  let m=d.detail;if(Array.isArray(m))m=m.map(x=>((x.loc||[]).slice(-1)[0]||'')+': '+x.msg).join(', ');
  throw new Error(typeof m==='string'&&m?m:(r.statusText||'Something went wrong'))}
 return d}

/* ---------- rendering ---------- */
let renderId=0;
async function render(){
 document.documentElement.lang=S.lang;
 const root=$('#root');
 if(!S.tok){root.innerHTML=authHTML();return}
 let {page,id}=route();
 if(['reports','users'].includes(page)&&S.role!=='admin'){go('#/dashboard');return}
 if(!['dashboard','patients','doctors','queue','payments','appointments','laboratory','pharmacy','reports','users','account'].includes(page))page='dashboard';
 const navPage=page;
 const rid=++renderId;
 root.innerHTML=shell(navPage==='patients'&&id?'patient':navPage,`<div class="loading">…</div>`);
 try{
  let html='';
  if(page==='dashboard'){[S.pts,S.queue,S.pays,S.docs,S.appts]=await Promise.all([api('/patients'),api('/queue'),api('/payments'),api('/doctors').catch(()=>[]),api('/appointments').catch(()=>[])]);html=pDashboard()}
  else if(page==='doctors'){S.docs=await api('/doctors');html=pDoctors()}
  else if(page==='patients'&&id){const [d,pts]=await Promise.all([api('/patients/'+encodeURIComponent(id)),api('/patients')]);S.detail=d;S.pts=pts;S.wk=nextWeek(d);html=pDetail()}
  else if(page==='patients'){S.pts=await api('/patients');html=pPatients()}
  else if(page==='queue'){[S.pts,S.queue]=await Promise.all([api('/patients'),api('/queue')]);html=pQueue()}
  else if(page==='payments'){[S.pts,S.pays]=await Promise.all([api('/patients'),api('/payments')]);html=pPayments()}
  else if(page==='appointments'){[S.docs,S.appts]=await Promise.all([api('/doctors'),api('/appointments')]);html=pAppointments()}
  else if(page==='laboratory'){[S.pts,S.labTests,S.labOrders]=await Promise.all([api('/patients'),api('/lab/tests'),api('/lab/orders')]);html=pLab()}
  else if(page==='pharmacy'){[S.pts,S.meds,S.phSales]=await Promise.all([api('/patients'),api('/pharmacy/medicines'),api('/pharmacy/sales')]);html=pPharmacy()}
  else if(page==='reports'){[S.pts,S.wrep]=await Promise.all([api('/patients'),api('/patients/weekly-report')]);html=pReports()}
  else if(page==='users'){S.users=await api('/auth/users');html=pUsers()}
  else if(page==='account'){html=pAccount()}
  if(rid!==renderId)return;
  $('#content').innerHTML=html;
 }catch(e){
  if(rid!==renderId||!S.tok)return;
  $('#content').innerHTML=`<div class="panel"><div class="empty"><b>Could not load this page</b>${esc(e.message)}<br><button class="btn" data-act="retry">Try again</button></div></div>`}
}

/* ---------- photo shrink (phone photos are huge) ---------- */
function shrink(file){
 return new Promise(res=>{
  if(!file||!file.type.startsWith('image/')||file.size<600000)return res(file);
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
   c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
   c.toBlob(b=>res(b||file),'image/jpeg',.85)};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

 if(o.status==='ordered'||o.status==='sample-collected'){
  b.push(`<button class="btn sm" type="button" data-act="labResult" data-id="${o.id}">Enter result</button>`);
  b.push(`<button class="btn ghost sm" type="button" data-act="labCancel" data-id="${o.id}">Cancel</button>`)}
 if(o.status==='completed')b.push(`<button class="btn ghost sm" type="button" data-act="labView" data-id="${o.id}">View result</button>`);
 return b.join(' ')}
function labRows(){
 if(!S.labOrders.length)return `<tr><td colspan="6"><div class="empty"><b>No lab orders yet</b>Order a test above.</div></td></tr>`;
 return S.labOrders.map(o=>`<tr><td>#${o.id}</td><td><b>${esc(o.test_name)}</b><br><small>${money(o.price)}</small></td><td>${esc(o.patient_name)}${o.patient_email?`<br><small>${esc(o.patient_email)}</small>`:''}</td><td>${labPill(o.status)}</td><td>${fmtD(o.created_at)}</td><td>${labActions(o)}</td></tr>`).join('')}
function pLab(){
 const admin=S.role==='admin';
 return `<div class="page-h"><div><h1>Laboratory</h1><p>Order tests, record results and email them to the patient.</p></div></div>
 <div class="panel" style="padding:18px"><form data-form="labOrder"><div class="fg">
  <label class="fld full"><span>${t('patient')}</span><select name="pid" required><option value="">${t('pick_patient')}</option>${S.pts.map(p=>`<option value="${p.id}">${esc(pname(p))} (#${p.id})</option>`).join('')}</select></label>
  <label class="fld full"><span>Test</span><select name="test_id" required><option value="">Choose a test</option>${S.labTests.map(x=>`<option value="${x.id}">${esc(x.name)} - ${esc(x.sample_type||'')} - ${money(x.price)}</option>`).join('')}</select></label>
 </div><p class="ferr" id="ferr" role="alert"></p><div style="margin-top:12px"><button class="btn" type="submit">Order test</button></div></form></div>
 <div class="page-h" style="margin-top:22px"><div><h1 style="font-size:18px">${admin?'All lab orders':'My lab orders'}</h1></div></div>
 <div class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>ID</th><th>Test</th><th>${t('patient')}</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody id="labbody">${labRows()}</tbody></table></div></div>
 ${admin?`<div class="page-h" style="margin-top:22px"><div><h1 style="font-size:18px">Add a lab test</h1></div></div>
 <div class="panel" style="padding:18px"><form data-form="labTest"><div class="fg">
  ${field('name','text','Test name','required maxlength="120"')}
  ${field('sample_type','text','Sample type','maxlength="40" value="Blood"')}
  ${field('price','number','Price (₹)','required min="0" step="0.01" inputmode="decimal"')}
 </div><p class="ferr" id="ferr" role="alert"></p><div style="margin-top:12px"><button class="btn" type="submit">Add test</button></div></form></div>`:''}`}
function labResultForm(o){
 return `<form data-form="labResult"><input type="hidden" name="oid" value="${o.id}">
 <p style="margin-bottom:12px"><b>${esc(o.test_name)}</b> - ${esc(o.patient_name)}</p><div class="fg">
  <label class="fld full"><span>Result</span><textarea name="result_text" rows="6" required maxlength="4000"></textarea></label>
  <label class="fld full"><span>Report file (optional - PDF or image)</span><input name="report" type="file" accept=".pdf,image/*"></label>
 </div><p class="ferr" id="ferr" role="alert"></p><div class="drawer-f"><button class="btn" type="submit">Save result and email patient</button></div></form>`}
async function refreshLab(){try{S.labOrders=await api('/lab/orders')}catch(e){return}const b=$('#labbody');if(b)b.innerHTML=labRows()}

/* ----- pharmacy (pharmacy service) ----- */
function medRows(){
 if(!S.meds.length)return `<tr><td colspan="5"><div class="empty"><b>No medicines in stock list</b></div></td></tr>`;
 return S.meds.map(m=>`<tr><td><b>${esc(m.name)}</b><br><small>${esc(m.unit||'')}</small></td><td>${money(m.unit_price)}</td><td>${m.stock<=20?`<b style="color:var(--amber)">${m.stock} (low)</b>`:m.stock}</td><td><input name="q_${m.id}" type="number" min="0" max="${m.stock}" step="1" value="0" inputmode="numeric" style="width:90px" ${m.stock?'':'disabled'}></td>${S.role==='admin'?`<td><button class="btn ghost sm" type="button" data-act="restock" data-id="${m.id}">Restock</button></td>`:''}</tr>`).join('')}
function saleRows(){
 if(!S.phSales.length)return `<tr><td colspan="6"><div class="empty"><b>No pharmacy sales yet</b></div></td></tr>`;
 return S.phSales.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.patient_name)}</td><td><small>${esc(x.items||'')}</small></td><td>${money(x.total)}<br><small>${esc(x.payment_method)}</small></td><td>${fmtD(x.created_at)}</td><td><button class="btn ghost sm" type="button" data-act="saleBill" data-id="${x.id}">Bill</button></td></tr>`).join('')}
function pPharmacy(){
 const admin=S.role==='admin';
 return `<div class="page-h"><div><h1>Pharmacy</h1><p>Sell medicines, track stock and email the bill.</p></div></div>
 <div class="panel" style="padding:18px"><form data-form="sale"><div class="fg">
  <label class="fld full"><span>${t('patient')}</span><select name="pid" required><option value="">${t('pick_patient')}</option>${S.pts.map(p=>`<option value="${p.id}">${esc(pname(p))} (#${p.id})</option>`).join('')}</select></label>
  <label class="fld full"><span>Payment</span><select name="payment_method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select></label>
 </div>
 <div class="scroll" style="margin-top:12px"><table class="tbl"><thead><tr><th>Medicine</th><th>Price</th><th>In stock</th><th>Quantity</th>${admin?'<th></th>':''}</tr></thead><tbody id="medbody">${medRows()}</tbody></table></div>
 <p class="ferr" id="ferr" role="alert"></p><div style="margin-top:12px"><button class="btn" type="submit">Sell and email bill</button></div></form></div>
 <div class="page-h" style="margin-top:22px"><div><h1 style="font-size:18px">${admin?'All pharmacy sales':'My pharmacy sales'}</h1></div></div>
 <div class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>Bill</th><th>${t('patient')}</th><th>Items</th><th>Total</th><th>Date</th><th></th></tr></thead><tbody id="salebody">${saleRows()}</tbody></table></div></div>
 ${admin?`<div class="page-h" style="margin-top:22px"><div><h1 style="font-size:18px">Add a medicine</h1></div></div>
 <div class="panel" style="padding:18px"><form data-form="medicine"><div class="fg">
  ${field('name','text','Medicine name','required maxlength="120"')}
  ${field('unit','text','Unit (tablet, capsule, bottle...)','maxlength="30" value="tablet"')}
  ${field('unit_price','number','Price per unit (₹)','required min="0" step="0.01" inputmode="decimal"')}
  ${field('stock','number','Opening stock','required min="0" step="1" value="0" inputmode="numeric"')}
 </div><p class="ferr" id="ferr" role="alert"></p><div style="margin-top:12px"><button class="btn" type="submit">Add medicine</button></div></form></div>`:''}`}
async function refreshPharmacy(){try{[S.meds,S.phSales]=await Promise.all([api('/pharmacy/medicines'),api('/pharmacy/sales')])}catch(e){return}const m=$('#medbody'),b=$('#salebody');if(m)m.innerHTML=medRows();if(b)b.innerHTML=saleRows()}

/* ---------- events ---------- */
const ferr=m=>{const e=$('#ferr');if(e)e.textContent=m||''};
const ACT={
 labSample:async b=>{b.disabled=true;try{await api('/lab/orders/'+b.dataset.id+'/status',{method:'PATCH',json:{status:'sample-collected'}});await refreshLab()}catch(e){toast(e.message,'err');b.disabled=false}},
 labCancel:async b=>{if(!confirm('Cancel this lab order?'))return;b.disabled=true;try{await api('/lab/orders/'+b.dataset.id+'/status',{method:'PATCH',json:{status:'cancelled'}});await refreshLab()}catch(e){toast(e.message,'err');b.disabled=false}},
 labResult:b=>{const o=S.labOrders.find(x=>String(x.id)===b.dataset.id);if(o)openDrawer('Enter lab result #'+o.id,labResultForm(o))},
 labView:b=>{const o=S.labOrders.find(x=>String(x.id)===b.dataset.id);if(o)openDrawer('Lab result #'+o.id,`<p><b>${esc(o.test_name)}</b> - ${esc(o.patient_name)}</p><pre style="white-space:pre-wrap;font:inherit;margin:12px 0">${esc(o.result_text||'')}</pre>${o.has_report?`<button class="btn sm" type="button" data-act="labReport" data-id="${o.id}">Open report file</button>`:''}`)},
 labReport:async b=>{try{const r=await api('/lab/orders/'+b.dataset.id+'/report');window.open(r.url,'_blank','noopener')}catch(e){toast(e.message,'err')}},
 restock:async b=>{const n=parseInt(prompt('How many units to add to the stock?','100'),10);if(!(n>0))return;try{await api('/pharmacy/medicines/'+b.dataset.id+'/restock',{json:{qty:n}});toast('Stock updated');await refreshPharmacy()}catch(e){toast(e.message,'err')}},
 saleBill:async b=>{try{const r=await api('/pharmacy/sales/'+b.dataset.id+'/bill');window.open(r.url,'_blank','noopener')}catch(e){toast(e.message,'err')}},
 accent:b=>{store.set('accent',b.dataset.a);applyAccent();render()},
 theme:()=>{store.set('theme',document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme();render()},
 forgot:()=>toast(t('forgot_msg')),
 mode:b=>{S.mode=b.dataset.m;render()},
 eye:b=>{const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password'},
 logout:()=>signOut(),
 retry:()=>render(),
 closeDrawer:()=>closeDrawer(),
 open:b=>go('#/patients/'+b.dataset.id),
 newPatient:()=>openDrawer(t('new_patient'),patientForm()),
 newQueue:()=>openDrawer(t('add_queue'),queueForm()),
 payFor:b=>openDrawer(t('record_payment'),payForm(b.dataset.id)),
 pickWeek:b=>{S.wk=+b.dataset.w;$('#wkbox').innerHTML=weeksHTML()},
 token:async b=>{try{const r=await api('/patients/'+b.dataset.id+'/token',{method:'POST'});toast(t('token_made',{n:r.token_no,p:pname(S.detail)}))}catch(e){toast(e.message,'err')}},
 print:()=>window.print(),
 mailDone:()=>{store.set(mailKey(),'1');const m=$('#mailbar');if(m)m.remove()},
 resendMail:async()=>{try{await api('/auth/notifications/resend',{method:'POST'});toast(t('mail_resent',{e:me()}))}catch(e){toast(e.message,'err')}},
 testMail:async()=>{try{await api('/auth/notifications/test',{method:'POST'});toast(t('mail_test_sent',{e:me()}))}catch(e){toast(e.message,'err')}},
 receipt:async b=>{try{const r=await api('/payments/'+b.dataset.id+'/receipt');openDrawer(t('receipt_title')+' #'+r.id,receiptHTML(r))}catch(e){toast(e.message,'err')}},
 emailReceipt:async b=>{b.disabled=true;try{const r=await api('/payments/'+b.dataset.id+'/email',{method:'POST'});toast(t('sent_to',{e:r.emailed_to.join(', ')}))}catch(e){toast(e.message,'err')}b.disabled=false},
 emailPatient:async b=>{b.disabled=true;try{const r=await api('/patients/'+b.dataset.id+'/email',{method:'POST'});toast(r.patient_has_email?t('sent_to',{e:r.emailed_to.join(', ')}):t('no_patient_email'))}catch(e){toast(e.message,'err')}b.disabled=false},
 pickSlot:b=>{const f=$('form[data-form="book"]');f.time.value=b.dataset.t;document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('on',x===b))},
 payAppt:async b=>{const m=b.parentElement.querySelector('.paysel').value;b.disabled=true;try{await api('/appointments/'+b.dataset.id+'/pay',{json:{method:m}});toast('Payment received. Receipt emailed.');await refreshAppts()}catch(e){toast(e.message,'err');b.disabled=false}},
 cancelAppt:async b=>{const ap=S.appts.find(x=>String(x.id)===String(b.dataset.id));const paid=ap&&ap.payment_status==='Paid';const half=paid?Math.floor(Number(ap.fee)/2):0;if(!confirm(paid?`Cancel this appointment? Only 50% (₹${half}) will be refunded; the other 50% is kept as cancellation charge.`:t('cancel_appt')+'?'))return;b.disabled=true;try{const r=await api('/appointments/'+b.dataset.id+'/cancel',{method:'POST'});toast(r.refund?`Appointment cancelled. 50% refund (₹${r.refund}) emailed.`:t('appt_cancelled'));await refreshAppts()}catch(e){toast(e.message,'err');b.disabled=false}},
 confirmAppt:async b=>{b.disabled=true;try{const r=await api('/appointments/'+b.dataset.id+'/confirm',{method:'POST'});toast(t(r.sms_sent?'sms_ok':'sms_fail',{m:r.to||''}),r.sms_sent?'':'err');await refreshAppts()}catch(e){toast(e.message,'err');b.disabled=false}},
 completeAppt:async b=>{b.disabled=true;try{await api('/appointments/'+b.dataset.id+'/complete',{method:'POST'});await refreshAppts()}catch(e){toast(e.message,'err');b.disabled=false}},
 status:async b=>{b.disabled=true;try{await api('/queue/'+b.dataset.id,{json:{status:b.dataset.s},method:'PATCH'});await refreshQueue()}catch(e){toast(e.message,'err');b.disabled=false}}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='closeDrawer'&&e.target.closest('.drawer')&&!e.target.closest('button[data-act="closeDrawer"]'))return;
 const f=ACT[b.dataset.act];if(f){if(b.tagName==='A')e.preventDefault();f(b,e)}});
document.addEventListener('change',e=>{
 if(e.target.closest('form[data-form="book"]')&&['doctor_id','date'].includes(e.target.name))loadSlots();
 if(e.target.name==='doctor_id'&&e.target.closest('form[data-form="book"]')){const o=e.target.selectedOptions[0],fb=$('#feebox');if(fb){fb.style.display=o&&o.dataset.fee?'block':'none';fb.textContent=o&&o.dataset.fee?t('fee')+': ₹'+o.dataset.fee:''}}
 if(e.target.dataset.change==='lang'){S.lang=e.target.value;store.set('lang',S.lang);render()}});
document.addEventListener('input',e=>{
 if(e.target.id==='psearch'){S.q=e.target.value;$('#ptbody').innerHTML=ptRows(filtered())}
 const f=e.target.closest('form');
 if(f&&f.dataset.form==='signup'&&e.target.name==='password'){const m=$('#meter');if(m)m.className='meter s'+strength(e.target.value)}});

const FORMS={
 async doctor(f,btn){
  const d=Object.fromEntries(new FormData(f));
  await busy(btn,'…',()=>api('/doctors',{json:{name:d.name.trim(),speciality:d.speciality.trim(),qualification:(d.qualification||'').trim(),fee:+d.fee}}));
  toast('Doctor added');render()},
 async labOrder(f,btn){
  const d=Object.fromEntries(new FormData(f)),p=S.pts.find(x=>String(x.id)===d.pid);
  if(!p)return ferr(t('pick_patient'));
  const r=await busy(btn,'…',()=>api('/lab/orders',{json:{test_id:+d.test_id,patient_id:p.id,patient_name:pname(p),patient_email:p.email||null}}));
  toast('Lab test ordered'+(r.emailed_to?' · emailed to '+r.emailed_to:''));f.reset();await refreshLab()},
 async labResult(f,btn){
  const fd=new FormData(f),oid=fd.get('oid'),file=fd.get('report');fd.delete('oid');
  if(!(file&&file.size))fd.delete('report');
  await busy(btn,'…',()=>api('/lab/orders/'+oid+'/result',{method:'POST',body:fd}));
  closeDrawer();toast('Result saved. The patient is emailed if an email is on file.');await refreshLab()},
 async labTest(f,btn){
  const d=Object.fromEntries(new FormData(f));
  await busy(btn,'…',()=>api('/lab/tests',{json:{name:d.name.trim(),sample_type:(d.sample_type||'').trim(),price:+d.price}}));
  toast('Test added');render()},
 async sale(f,btn){
  const d=Object.fromEntries(new FormData(f)),p=S.pts.find(x=>String(x.id)===d.pid);
  if(!p)return ferr(t('pick_patient'));
  const items=Object.keys(d).filter(k=>k.startsWith('q_')&&+d[k]>0).map(k=>({medicine_id:+k.slice(2),qty:+d[k]}));
  if(!items.length)return ferr('Enter a quantity for at least one medicine.');
  const r=await busy(btn,'…',()=>api('/pharmacy/sales',{json:{patient_id:p.id,patient_name:pname(p),patient_email:p.email||null,payment_method:d.payment_method,items}}));
  toast('Sale #'+r.id+' saved - total '+money(r.total)+(r.emailed_to?' · bill emailed to '+r.emailed_to:''));await refreshPharmacy()},
 async medicine(f,btn){
  const d=Object.fromEntries(new FormData(f));
  await busy(btn,'…',()=>api('/pharmacy/medicines',{json:{name:d.name.trim(),unit:(d.unit||'tablet').trim(),unit_price:+d.unit_price,stock:+d.stock}}));
  toast('Medicine added');render()},
 async login(f,btn){
  const d=Object.fromEntries(new FormData(f));
  if(!d.email.trim()||!d.password)return ferr('Enter your email and password.');
  store.set('remember',d.remember?'1':'0');try{sessionStorage.setItem('alive','1')}catch(e){}
  await busy(btn,t('signing'),()=>doLogin(d.email,d.password))},
 async patient(f,btn){
  const fd=new FormData(f),d=Object.fromEntries(fd);d.age=+d.age;d.diseases=fd.getAll('diseases');d.email=(d.email||'').trim()||null;
  const r=await busy(btn,'…',()=>api('/patients',{json:d}));
  closeDrawer();toast(t('patient_saved')+(r.emailed_to?' · '+t('sent_to',{e:r.emailed_to}):''));go('#/patients/'+r.id)},
 async week(f,btn){
  const fd=new FormData(f),file=fd.get('photo');
  if(file&&file.size){fd.set('photo',await shrink(file),'photo.jpg')}else fd.delete('photo');
  await busy(btn,'…',()=>api('/patients/'+S.detail.id+'/weeks',{method:'POST',body:fd}));
  toast(t('week_saved',{w:fd.get('week')}));render()},
 async queue(f,btn){
  const pid=f.pid.value;if(!pid)return ferr(t('pick_patient'));
  const r=await busy(btn,'…',()=>api('/patients/'+pid+'/token',{method:'POST'}));
  const p=S.pts.find(x=>String(x.id)===pid);closeDrawer();toast(t('token_made',{n:r.token_no,p:p?pname(p):''}));
  if(route().page==='queue'||route().page==='dashboard')render()},
 async pay(f,btn){
  const d=Object.fromEntries(new FormData(f)),p=S.pts.find(x=>String(x.id)===d.pid);
  if(!p)return ferr(t('pick_patient'));
  const r=await busy(btn,'…',()=>api('/payments',{json:{patient_id:p.id,patient_name:pname(p),patient_email:p.email||null,amount:+d.amount,method:d.method}}));
  const row={id:r.id,patient_name:pname(p),amount:+d.amount,method:d.method,created_at:r.created_at,created_by:me(),receipt_url:r.receipt_url};
  openDrawer(t('pay_done'),receiptHTML(row,r.emailed_to));
  if(route().page==='payments')refreshPays()},
 async book(f,btn){
  const d=Object.fromEntries(new FormData(f));
  if(!d.doctor_id||!d.date||!d.time)return ferr(t('pick_all'));
  if(!/^(\+?91|0)?[6-9]\d{9}$/.test(d.patient_mobile.replace(/[\s-]/g,'')))return ferr(t('bad_mobile'));
  const r=await busy(btn,'…',()=>api('/appointments',{json:{doctor_id:+d.doctor_id,date:d.date,time:d.time,patient_name:d.patient_name.trim(),patient_mobile:d.patient_mobile.trim(),patient_email:d.patient_email.trim(),payment_method:d.payment_method,reason:d.reason.trim()}}));
  toast(t('booked_ok',{d:r.doctor,dt:r.date,tm:r.time,e:r.emailed_to}));f.reason.value='';await loadSlots();await refreshAppts()},
 async user(f,btn){
  const d=Object.fromEntries(new FormData(f));d.email=d.email.trim().toLowerCase();d.name=d.name.trim();
  if(d.password.length<8)return ferr(t('pw_hint')+'.');
  await busy(btn,'…',()=>api('/auth/register',{json:d}));toast(t('user_added'));render()}
};
document.addEventListener('submit',async e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 const fn=FORMS[f.dataset.form];if(!fn)return;ferr('');
 try{await fn(f,f.querySelector('button[type=submit]'))}catch(x){ferr(x.message);if(!$('#ferr'))toast(x.message,'err')}});

window.addEventListener('hashchange',()=>render());
setInterval(()=>{if(S.tok&&!document.hidden&&['queue','dashboard'].includes(route().page)&&!$('#overlay').innerHTML)refreshQueue()},20000);
applyTheme();applyAccent();try{if(store.get('remember')==='0'&&!sessionStorage.getItem('alive')){['tok','role','name'].forEach(store.del);S.tok=S.role=S.name=''}}catch(e){}
render();
</script>
</body>
