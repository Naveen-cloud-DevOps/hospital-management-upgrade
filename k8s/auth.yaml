apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, namespace: hms}
spec:
  replicas: 2
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      serviceAccountName: hms-sa
      containers:
        - name: app
          image: 381491944081.dkr.ecr.us-east-1.amazonaws.com/hospital-management-auth:bf45f573c3da1726a7609bf7d9221ce234dfc33a
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: hms-config}
            - secretRef: {name: hms-secrets}
            - secretRef: {name: authdb-conn}   # RDS endpoints + credentials, created by the deploy job
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: auth-service, namespace: hms}
spec:
  selector: {app: auth-service}
  ports: [{port: 80, targetPort: 8000}]
