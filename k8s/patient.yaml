apiVersion: apps/v1
kind: Deployment
metadata: {name: patient-service, namespace: hms}
spec:
  replicas: 2
  selector: {matchLabels: {app: patient-service}}
  template:
    metadata: {labels: {app: patient-service}}
    spec:
      serviceAccountName: hms-sa
      containers:
        - name: app
          image: 381491825192.dkr.ecr.us-east-1.amazonaws.com/hospital-management-patient:3d0f478d44b40babc053fa860674d57c41ce4885
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: hms-config}
            - secretRef: {name: hms-secrets}
            - secretRef: {name: patientdb-conn}   # RDS endpoints + credentials, created by the deploy job
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: patient-service, namespace: hms}
spec:
  selector: {app: patient-service}
  ports: [{port: 80, targetPort: 8000}]
