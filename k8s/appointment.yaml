apiVersion: apps/v1
kind: Deployment
metadata: {name: appointment-service, namespace: hms}
spec:
  replicas: 2
  selector: {matchLabels: {app: appointment-service}}
  template:
    metadata: {labels: {app: appointment-service}}
    spec:
      serviceAccountName: hms-sa
      containers:
        - name: app
          image: 497046674646.dkr.ecr.us-east-1.amazonaws.com/hospital-management-appointment:dbe2d48c429a3591f0266f0a4b794a2f47d1fc92
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: hms-config}
            - secretRef: {name: hms-secrets}
            - secretRef: {name: appointmentdb-conn}   # RDS endpoints + credentials, created by the deploy job
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: appointment-service, namespace: hms}
spec:
  selector: {app: appointment-service}
  ports: [{port: 80, targetPort: 8000}]
