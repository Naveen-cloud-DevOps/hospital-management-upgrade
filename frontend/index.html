<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="light dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarePulse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%23312e81'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg transform='translate(5 5) scale(.91)' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/%3E%3Cpath d='M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Oriya:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10222f;--muted:#5b6e79;--line:#dde6ea;--bg:#f1f5f7;--surface:#fff;--brand:#0b5d6b;--brand-d:#08434d;--brand-l:#d8eff2;
--amber:#8a5700;--amber-l:#fff1d6;--green:#1b6b45;--green-l:#ddf3e7;--red:#b3372e;--red-l:#fbe4e1;--r:14px}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font:15px/1.5 "Figtree","Noto Sans Devanagari","Noto Sans Oriya",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #7cc4cf;outline-offset:2px}
[hidden]{display:none!important}
.grow{flex:1}

/* buttons + fields */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--brand-d)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--brand-d);border-color:var(--line)}
.btn.ghost:hover{background:#f3f8f9}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:12px 16px}
.icon{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.icon:hover{background:#eef3f5}
.fld{display:grid;gap:5px;font-size:13.5px;font-weight:600;color:#33454f}
.fld>span small{font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea,.lang{width:100%;padding:10px 12px;border:1px solid #c5d3d9;border-radius:10px;background:#fff;font-weight:400;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.lang:focus{border-color:var(--brand);outline:3px solid #cfe9ed;outline-offset:0}
.fld textarea{resize:vertical;min-height:84px}
.lang{width:auto;padding:7px 10px;font-size:14px}
.pw{position:relative}
.pw input{padding-right:44px}
.pw .eye{position:absolute;right:4px;top:3px}
.meter{display:flex;gap:4px;margin-top:2px}
.meter i{flex:1;height:4px;border-radius:2px;background:#e1e9ec}
.meter.s1 i:nth-child(1){background:#d9534f}
.meter.s2 i:nth-child(-n+2){background:#e0a100}
.meter.s3 i{background:#2e9a62}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.ferr{min-height:20px;color:var(--red);font-size:14px;font-weight:500}

/* auth */
.auth{display:grid;grid-template-columns:minmax(340px,1fr) minmax(380px,1fr);min-height:100vh}
.auth-side{background:#0a3a46;color:#e6f4f6;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side h1{font-size:34px;line-height:1.15;font-weight:700;max-width:14em;margin-bottom:12px}
.auth-side p{color:#a9cdd4;max-width:30em}
.auth-side .ecg{position:absolute;left:-20px;right:-20px;top:36%;width:calc(100% + 40px);opacity:.5}
.ecg polyline{fill:none;stroke:#3aa7b8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.brandrow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;position:relative}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
.auth-side .logo{background:#12707f}
.auth-main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;position:relative}
.auth-top{position:absolute;top:18px;right:20px}
.auth-card{width:100%;max-width:410px}
.auth-card .mob{display:none;margin-bottom:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e6edf0;border-radius:11px;padding:4px;margin-bottom:26px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}
.auth-card h2{font-size:26px;font-weight:700;margin-bottom:4px}
.auth-card .sub{color:var(--muted);margin-bottom:22px}
.auth-card form{display:grid;gap:15px}
.auth-card .alt{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.auth-card .alt button{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0}
.note{margin-top:20px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.side .brandrow{padding:0 8px}
.nav{display:grid;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:#f3f7f8;color:var(--ink)}
.nav a.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:#f4f8f9;display:flex;gap:10px;align-items:center;min-width:0}
.side-foot div{min-width:0;line-height:1.3}
.side-foot b,.side-foot small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot small{color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.top{display:flex;align-items:center;gap:12px;padding:14px 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h2{font-size:18px;font-weight:700}
.content{padding:26px 32px 40px;max-width:1200px}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:26px;font-weight:700}
.page-h p{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.panel-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:16px;font-weight:700}
.panel-b{padding:20px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.cols.even{grid-template-columns:1fr 1fr}
.cols .panel{margin-bottom:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:18px 22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.stat span{color:var(--muted);font-size:13.5px}

.scroll{overflow:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);background:#f8fafb;white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid #eef2f4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover{background:#f6fafb}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.who b{display:block;line-height:1.25}
.who small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.waiting{background:var(--amber-l);color:var(--amber)}
.pill.in-progress{background:var(--brand-l);color:var(--brand-d)}
.pill.done{background:var(--green-l);color:var(--green)}
.pill.dx{background:#eef1f8;color:#40508a;margin:1px 3px 1px 0}
.pill.role{background:#eef1f8;color:#40508a}
.pill.admin{background:#f3e8fb;color:#6a2f93}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search input{width:100%;padding:9px 12px 9px 38px;border:1px solid #c5d3d9;border-radius:10px;background:#fff}
.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* queue tickets */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:#e7eef1;border-radius:var(--r);padding:12px}
.col h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px}
.col h3 em{font-style:normal;font-weight:600;background:#fff;border-radius:99px;padding:0 9px;color:var(--muted)}
.ticket{background:#fff;border-radius:12px;display:grid;grid-template-columns:66px 1fr;margin-bottom:10px;border:1px solid var(--line)}
.ticket .no{display:grid;place-items:center;font-size:27px;font-weight:700;color:var(--brand-d);border-right:2px dashed #c3d2d9;position:relative}
.ticket .no::before,.ticket .no::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:#e7eef1}
.ticket .no::before{top:-9px}
.ticket .no::after{bottom:-9px}
.ticket .info{padding:10px 12px;display:grid;gap:8px;min-width:0}
.ticket .info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .btns{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:grid}
.mini .row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid #eef2f4}
.mini .row:last-child{border-bottom:0}
.mini .n{font-weight:700;color:var(--brand-d);width:34px}

/* patient detail */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 20px}
.kv div small{display:block;color:var(--muted);font-size:12.5px}
.kv div span{font-weight:500;word-break:break-word}
.kv .full{grid-column:1/-1}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.wk{border:1px dashed #b9c9d0;border-radius:12px;padding:10px;text-align:left;background:#fff;cursor:pointer;display:grid;gap:2px}
.wk b{font-size:13px}
.wk small{color:var(--muted);font-size:12px}
.wk.done{border-style:solid;border-color:#bfe3cf;background:var(--green-l)}
.wk.done small{color:var(--green)}
.wk.sel{outline:3px solid #9fd0d8;outline-offset:1px}
.wkview{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fafcfc}
.wkview form{display:grid;gap:14px}
.photo-link{display:inline-flex;gap:6px;align-items:center;color:var(--brand);font-weight:600;text-decoration:none}

/* form grids + chips */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipc{position:relative}
.chipc input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chipc span{display:inline-block;padding:7px 14px;border-radius:99px;border:1px solid #c5d3d9;background:#fff;font-weight:500;font-size:14px}
.chipc input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.chipc input:focus-visible+span{outline:3px solid #7cc4cf;outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;gap:6px}

/* drawer + toasts */
.scrim{position:fixed;inset:0;background:#0a1f2988;z-index:30;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 40px #0003;animation:slide .2s ease-out}
.drawer>header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer>header h2{flex:1;font-size:19px}
.drawer-b{padding:20px;overflow:auto}
.drawer-f{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:grid;gap:8px;max-width:calc(100% - 40px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px #0004;animation:slide .2s}
.toast.err{background:var(--red)}
.toast a{color:#9fe0ea;font-weight:600}
.loading{padding:60px;text-align:center;color:var(--muted)}

.mailbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 32px;background:#fff6e0;border-bottom:1px solid #f0dcaa;color:#6b4a00;font-size:14px}
.mailbar p{flex:1;min-width:220px}
.ticks{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.ticks li::before{content:"\2713";color:var(--green);font-weight:700;margin-right:10px}
.rcpt{border:1px dashed #b9c9d0;border-radius:12px;padding:20px;background:#fff}
.rcpt-h{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.rcpt-h small{display:block;color:var(--muted)}
.rcpt-amt{margin-top:18px;padding-top:14px;border-top:2px dashed #c3d2d9;display:flex;justify-content:space-between;align-items:baseline}
.rcpt-amt b{font-size:28px}
@media print{body *{visibility:hidden}#receiptPrint,#receiptPrint *{visibility:visible}#receiptPrint{position:fixed;left:0;top:0;width:100%;border:0}}
@media(max-width:1000px){.cols,.cols.even{grid-template-columns:1fr}.board{grid-template-columns:1fr}}
@media(max-width:860px){
 .auth{grid-template-columns:1fr}.auth-side{display:none}.auth-card .mob{display:flex}
 .shell{grid-template-columns:1fr}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px;gap:0;z-index:20;border-right:0;border-top:1px solid var(--line)}
 .side .brandrow,.side-foot{display:none}
 .nav{display:flex;width:100%;justify-content:space-around}
 .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;text-align:center}
 .content{padding:18px 14px 96px}.top{padding:12px 14px}.toasts{bottom:84px;right:14px}.mailbar{padding:10px 14px}
 .stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .fg,.kv{grid-template-columns:1fr}
 .weeks{grid-template-columns:repeat(5,minmax(78px,1fr));overflow:auto}
}
.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{border:1px solid var(--line,#d8e2e5);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}.slot:hover:not(:disabled){border-color:var(--brand)}.slot.on{background:var(--brand);color:#fff;border-color:var(--brand)}.slot:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== premium theme: navy / indigo, light + dark ===== */
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f6fb;--soft:#eef1f8;--surface:#fff;--brand:#4338ca;--brand-d:#312e81;--brand-l:#e0e7ff;--sh:0 1px 2px #0f172a0f,0 4px 16px #0f172a0d}
[data-theme=dark]{color-scheme:dark;--ink:#e6eaf7;--muted:#9aa6c4;--line:#27314f;--bg:#0b1020;--soft:#1b2440;--surface:#131a2e;--brand:#818cf8;--brand-d:#c7d2fe;--brand-l:#232b57;--sh:0 1px 2px #0006}
.btn{background:#4338ca;border-color:#4338ca;box-shadow:0 1px 2px #4338ca44}.btn:hover{background:#312e81}
[data-theme=dark] .btn{background:#4f46e5;border-color:#4f46e5;color:#fff}[data-theme=dark] .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.logo,.auth-side .logo{background:linear-gradient(135deg,#4f46e5,#312e81)}
.auth-side{background:linear-gradient(160deg,#0b1437,#1e2a78 62%,#312e81)}.auth-side p{color:#c7d2fe}.ecg polyline{stroke:#818cf8}
.fld input:focus,.fld select:focus,.fld textarea:focus,.lang:focus{outline-color:#c7d2fe}[data-theme=dark] .fld input:focus{outline-color:#3730a3}
.panel,.side,.top{box-shadow:var(--sh)}.panel{border-radius:14px}.side{border-right-color:var(--line)}
.top{position:sticky;top:0;z-index:5;background:var(--surface)}
.nav a{transition:background .15s,color .15s}.nav a.on{background:var(--brand-l);color:var(--brand-d);box-shadow:inset 3px 0 0 var(--brand)}
.stat{transition:background .15s}.stat b{color:var(--brand-d)}
.auth-top{display:flex;gap:8px;align-items:center}.feats{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:12px;position:relative}
.feats li{display:flex;gap:12px;align-items:center;color:#e0e7ff;font-weight:500}.feats li span{width:34px;height:34px;border-radius:10px;background:#ffffff1f;display:grid;place-items:center;flex:none}
.rowline{display:flex;justify-content:space-between;align-items:center;font-size:14px}.rowline a{color:var(--brand);font-weight:600;text-decoration:none}
.chk{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}.chk input{accent-color:var(--brand);width:16px;height:16px}
button:focus-visible,a:focus-visible,.nav a:focus-visible{outline:3px solid #818cf8;outline-offset:2px}
[data-theme=dark] .btn.ghost{background:var(--surface)}
[data-theme=dark] .btn.ghost:hover{background:var(--soft)}
[data-theme=dark] .icon:hover{background:var(--soft)}
[data-theme=dark] .fld input{background:var(--surface)}
[data-theme=dark] .fld select{background:var(--surface)}
[data-theme=dark] .fld textarea{background:var(--surface)}
[data-theme=dark] .lang{background:var(--surface)}
[data-theme=dark] .meter i{background:var(--soft)}
[data-theme=dark] .meter.s2 i:nth-child(-n+2){background:var(--soft)}
[data-theme=dark] .tabs{background:var(--soft)}
[data-theme=dark] .tabs button.on{background:var(--surface)}
[data-theme=dark] .note{background:var(--surface)}
[data-theme=dark] .side{background:var(--surface)}
[data-theme=dark] .nav a:hover{background:var(--soft)}
[data-theme=dark] .side-foot{background:var(--soft)}
[data-theme=dark] .tbl th{background:var(--soft)}
[data-theme=dark] .tbl tr.click:hover{background:var(--soft)}
[data-theme=dark] .pill.dx{background:var(--soft)}
[data-theme=dark] .pill.role{background:var(--soft)}
[data-theme=dark] .pill.admin{background:var(--soft)}
[data-theme=dark] .search input{background:var(--surface)}
[data-theme=dark] .col{background:var(--soft)}
[data-theme=dark] .col h3 em{background:var(--surface)}
[data-theme=dark] .ticket{background:var(--surface)}
[data-theme=dark] .ticket .no::before{background:var(--soft)}
[data-theme=dark] .ticket .no::after{background:var(--soft)}
[data-theme=dark] .wk{background:var(--surface)}
[data-theme=dark] .wkview{background:var(--soft)}
[data-theme=dark] .chipc span{background:var(--surface)}
[data-theme=dark] .drawer{background:var(--surface)}
[data-theme=dark] .mailbar{background:var(--surface)}
[data-theme=dark] .rcpt{background:var(--surface)}
[data-theme=dark] .slot{background:var(--surface)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.kpi i{width:42px;height:42px;border-radius:12px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;flex:none}
.kpi b{display:block;font-size:24px;line-height:1.1}.kpi span{color:var(--muted);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:12px 18px 14px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:12px;color:var(--muted)}
.bars i{display:block;width:100%;max-width:36px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#6366f1,#4338ca);min-height:3px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh)}.dcard .av{width:52px;height:52px;font-size:17px;margin-bottom:12px}.dcard h3{font-size:17px}
.fee{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:99px;background:var(--brand-l);color:var(--brand-d);font-weight:600;font-size:13px}

/* white text: login brand panel + dark mode */
.auth-side,.auth-side h1,.auth-side p,.auth-side .brandrow,.feats li{color:#fff}
[data-theme=dark]{--ink:#fff;--muted:#d5dbf0;--brand-d:#fff}

/* dark mode: white text inside dropdowns and form boxes */
[data-theme=dark] select,[data-theme=dark] option,[data-theme=dark] optgroup{background-color:#131a2e;color:#fff}
[data-theme=dark] option:checked{background-color:#4f46e5;color:#fff}
[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] .fld select{color:#fff}
[data-theme=dark] ::placeholder{color:#9aa6c4;opacity:1}

/* ===== MediCore-style layout: hidden sidebar that slides in from the left, hero, colourful cards ===== */
:root{--brand:#2563eb;--brand-d:#1e40af;--brand-l:#dbeafe}[data-theme=dark]{--brand:#60a5fa;--brand-d:#fff;--brand-l:#1e2f5c}
.btn,[data-theme=dark] .btn{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 6px 16px #2563eb44}.btn:hover{background:#1d4ed8}
.btn.ghost,[data-theme=dark] .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
.side,[data-theme=dark] .side{background:linear-gradient(180deg,#0b1437,#0f1f4d 55%,#0b2a52);color:#e2e8f0;border:0}
.side .brandrow{color:#fff;font-weight:700;font-size:18px}
.nav-sec{margin:14px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7c8db5}
.nav a,.nav a:hover{color:#cbd5e1}.nav a:hover,[data-theme=dark] .nav a:hover{background:#ffffff14}
.nav a.on,.nav a.on:hover{background:linear-gradient(90deg,#0d9488,#2563eb);color:#fff;box-shadow:0 8px 20px #2563eb55}
.side-foot,[data-theme=dark] .side-foot{background:#ffffff12;color:#fff}.side-foot small{color:#9fb0d3}
.side-out{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#f87171;font:inherit;font-weight:600;background:none;border:0;cursor:pointer}.side-out:hover{background:#ffffff14}
.hero{border-radius:20px;padding:34px 38px;margin-bottom:22px;color:#fff;background:radial-gradient(900px 300px at 100% 0,#0e7490aa,transparent 60%),linear-gradient(135deg,#0b1437,#14306b 60%,#0f4c5c);box-shadow:var(--sh)}
.hero small{letter-spacing:.14em;font-weight:700;color:#5eead4;text-transform:uppercase}.hero h2{font-size:clamp(24px,3.2vw,36px);margin:8px 0;color:#fff}.hero p{color:#dbe7ff;max-width:640px}.hero .btn.ghost{background:#ffffff1f;color:#fff;border-color:#ffffff40}
.kpi{position:relative;overflow:hidden}.kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.kpi i{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);box-shadow:0 6px 14px color-mix(in srgb,var(--c) 22%,transparent)}.kpi b{font-size:28px;color:var(--ink)}
.dt{color:var(--muted);font-size:14px;margin-right:6px}
.hot{display:none}
@media(min-width:861px){
 .shell{grid-template-columns:1fr}.hot{display:block;position:fixed;left:0;top:0;bottom:0;width:18px;z-index:39}
 .side{position:fixed;left:0;top:0;bottom:0;width:268px;height:100vh;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:40;overflow-y:auto}
 .hot:hover+.side,.side:hover,.side:focus-within{transform:none;box-shadow:12px 0 40px #0b143780}
 .shell::before{content:'';position:fixed;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#2563eb,#14b8a6);z-index:35;pointer-events:none}
}
@media(max-width:860px){.nav-sec,.side-out{display:none}}
</style>

function toast(msg,type,html){

async function api(path,o={}){
 const h={...(o.headers||{})};if(S.tok)h.Authorization='Bearer '+S.tok;
 let body=o.body,method=o.method;
 if(o.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.json);method=method||'POST'}
 const r=await fetch(path,{method,body,headers:h});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){
  if(r.status===401&&S.tok&&!o.noLogout)signOut();
  let m=d.detail;if(Array.isArray(m))m=m.map(x=>((x.loc||[]).slice(-1)[0]||'')+': '+x.msg).join(', ');
  throw new Error(typeof m==='string'&&m?m:(r.statusText||'Something went wrong'))}
 return d}

/* ---------- rendering ---------- */
let renderId=0;
async function render(){
 document.documentElement.lang=S.lang;
 const root=$('#root');
 if(!S.tok){root.innerHTML=authHTML();return}
 let {page,id}=route();
 if(['reports','users'].includes(page)&&S.role!=='admin'){go('#/dashboard');return}
 if(!['dashboard','patients','doctors','queue','payments','appointments','laboratory','pharmacy','reports','users','account'].includes(page))page='dashboard';
 const navPage=page;
 const rid=++renderId;
 root.innerHTML=shell(navPage==='patients'&&id?'patient':navPage,`<div class="loading">…</div>`);
 try{
  let html='';
  if(page==='dashboard'){[S.pts,S.queue,S.pays,S.docs,S.appts]=await Promise.all([api('/patients'),api('/queue'),api('/payments'),api('/doctors').catch(()=>[]),api('/appointments').catch(()=>[])]);html=pDashboard()}
  else if(page==='doctors'){S.docs=await api('/doctors');html=pDoctors()}
  else if(page==='patients'&&id){const [d,pts]=await Promise.all([api('/patients/'+encodeURIComponent(id)),api('/patients')]);S.detail=d;S.pts=pts;S.wk=nextWeek(d);html=pDetail()}
  else if(page==='patients'){S.pts=await api('/patients');html=pPatients()}
  else if(page==='queue'){[S.pts,S.queue]=await Promise.all([api('/patients'),api('/queue')]);html=pQueue()}
  else if(page==='payments'){[S.pts,S.pays]=await Promise.all([api('/patients'),api('/payments')]);html=pPayments()}
  else if(page==='appointments'){[S.docs,S.appts]=await Promise.all([api('/doctors'),api('/appointments')]);html=pAppointments()}
  else if(page==='laboratory'){[S.pts,S.labTests,S.labOrders]=await Promise.all([api('/patients'),api('/lab/tests'),api('/lab/orders')]);html=pLab()}
  else if(page==='pharmacy'){[S.pts,S.meds,S.phSales]=await Promise.all([api('/patients'),api('/pharmacy/medicines'),api('/pharmacy/sales')]);html=pPharmacy()}
  else if(page==='reports'){[S.pts,S.wrep]=await Promise.all([api('/patients'),api('/patients/weekly-report')]);html=pReports()}
  else if(page==='users'){S.users=await api('/auth/users');html=pUsers()}
  else if(page==='account'){html=pAccount()}
  if(rid!==renderId)return;
  $('#content').innerHTML=html;
 }catch(e){
  if(rid!==renderId||!S.tok)return;
  $('#content').innerHTML=`<div class="panel"><div class="empty"><b>Could not load this page</b>${esc(e.message)}<br><button class="btn" data-act="retry">Try again</button></div></div>`}
}

/* ---------- photo shrink (phone photos are huge) ---------- */
function shrink(file){
 return new Promise(res=>{
  if(!file||!file.type.startsWith('image/')||file.size<600000)return res(file);
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
   c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
   c.toBlob(b=>res(b||file),'image/jpeg',.85)};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

  if(!items.length)return ferr('Enter a quantity for at least one medicine.');
  const r=await busy(btn,'…',()=>api('/pharmacy/sales',{json:{patient_id:p.id,patient_name:pname(p),patient_email:p.email||null,payment_method:d.payment_method,items}}));
  toast('Sale #'+r.id+' saved - total '+money(r.total)+(r.emailed_to?' · bill emailed to '+r.emailed_to:''));await refreshPharmacy()},
 async medicine(f,btn){
  const d=Object.fromEntries(new FormData(f));
  await busy(btn,'…',()=>api('/pharmacy/medicines',{json:{name:d.name.trim(),unit:(d.unit||'tablet').trim(),unit_price:+d.unit_price,stock:+d.stock}}));
  toast('Medicine added');render()},
 async login(f,btn){
  const d=Object.fromEntries(new FormData(f));
  if(!d.email.trim()||!d.password)return ferr('Enter your email and password.');
  store.set('remember',d.remember?'1':'0');try{sessionStorage.setItem('alive','1')}catch(e){}
  await busy(btn,t('signing'),()=>doLogin(d.email,d.password))},
 async patient(f,btn){
  const fd=new FormData(f),d=Object.fromEntries(fd);d.age=+d.age;d.diseases=fd.getAll('diseases');d.email=(d.email||'').trim()||null;
  const r=await busy(btn,'…',()=>api('/patients',{json:d}));
  closeDrawer();toast(t('patient_saved')+(r.emailed_to?' · '+t('sent_to',{e:r.emailed_to}):''));go('#/patients/'+r.id)},
 async week(f,btn){
  const fd=new FormData(f),file=fd.get('photo');
  if(file&&file.size){fd.set('photo',await shrink(file),'photo.jpg')}else fd.delete('photo');
  await busy(btn,'…',()=>api('/patients/'+S.detail.id+'/weeks',{method:'POST',body:fd}));
  toast(t('week_saved',{w:fd.get('week')}));render()},
 async queue(f,btn){
  const pid=f.pid.value;if(!pid)return ferr(t('pick_patient'));
  const r=await busy(btn,'…',()=>api('/patients/'+pid+'/token',{method:'POST'}));
  const p=S.pts.find(x=>String(x.id)===pid);closeDrawer();toast(t('token_made',{n:r.token_no,p:p?pname(p):''}));
  if(route().page==='queue'||route().page==='dashboard')render()},
 async pay(f,btn){
  const d=Object.fromEntries(new FormData(f)),p=S.pts.find(x=>String(x.id)===d.pid);
  if(!p)return ferr(t('pick_patient'));
  const r=await busy(btn,'…',()=>api('/payments',{json:{patient_id:p.id,patient_name:pname(p),patient_email:p.email||null,amount:+d.amount,method:d.method}}));
  const row={id:r.id,patient_name:pname(p),amount:+d.amount,method:d.method,created_at:r.created_at,created_by:me(),receipt_url:r.receipt_url};
  openDrawer(t('pay_done'),receiptHTML(row,r.emailed_to));
  if(route().page==='payments')refreshPays()},
 async book(f,btn){
  const d=Object.fromEntries(new FormData(f));
  if(!d.doctor_id||!d.date||!d.time)return ferr(t('pick_all'));
  if(!/^(\+?91|0)?[6-9]\d{9}$/.test(d.patient_mobile.replace(/[\s-]/g,'')))return ferr(t('bad_mobile'));
  const r=await busy(btn,'…',()=>api('/appointments',{json:{doctor_id:+d.doctor_id,date:d.date,time:d.time,patient_name:d.patient_name.trim(),patient_mobile:d.patient_mobile.trim(),patient_email:d.patient_email.trim(),payment_method:d.payment_method,reason:d.reason.trim()}}));
  toast(t('booked_ok',{d:r.doctor,dt:r.date,tm:r.time,e:r.emailed_to}));f.reason.value='';await loadSlots();await refreshAppts()},
 async user(f,btn){
  const d=Object.fromEntries(new FormData(f));d.email=d.email.trim().toLowerCase();d.name=d.name.trim();
  if(d.password.length<8)return ferr(t('pw_hint')+'.');
  await busy(btn,'…',()=>api('/auth/register',{json:d}));toast(t('user_added'));render()}
};
document.addEventListener('submit',async e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 const fn=FORMS[f.dataset.form];if(!fn)return;ferr('');
 try{await fn(f,f.querySelector('button[type=submit]'))}catch(x){ferr(x.message);if(!$('#ferr'))toast(x.message,'err')}});

window.addEventListener('hashchange',()=>render());
setInterval(()=>{if(S.tok&&!document.hidden&&['queue','dashboard'].includes(route().page)&&!$('#overlay').innerHTML)refreshQueue()},20000);
applyTheme();try{if(store.get('remember')==='0'&&!sessionStorage.getItem('alive')){['tok','role','name'].forEach(store.del);S.tok=S.role=S.name=''}}catch(e){}
render();
</script>
</body>
</html>
